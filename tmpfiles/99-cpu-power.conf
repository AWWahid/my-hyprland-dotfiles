# Let the video group write the CPU power knobs, so the waybar battery menu
# (hypr/scripts/power-mode.sh) can change them without sudo, polkit or a daemon.
# video is chosen because this user is already in it on any seat-local login and it
# exists on every distro; nothing else in sysfs uses it here, so the grant is narrow.
# Re-applied on each boot by systemd-tmpfiles-setup, because sysfs permissions reset.
# SELinux (targeted, enforcing) does not block this: unconfined_t is in
# files_unconfined_type, which the policy allows write on sysfs_t.
#
# Install: see CLAUDE.md.

z /sys/devices/system/cpu/intel_pstate/max_perf_pct                  0664 root video -
z /sys/devices/system/cpu/intel_pstate/hwp_dynamic_boost             0664 root video -
z /sys/devices/system/cpu/cpu*/cpufreq/energy_performance_preference 0664 root video -
