# Mouse UI from uosc (seek bar, volume, right-click menu for tracks, subtitles, speed, playlist),
# installed and updated with its own installer (see CLAUDE.md); it writes scripts/, fonts/ and
# script-opts/uosc.conf, all gitignored
osc=no
osd-bar=no

# Hardware decoding on the Intel iGPU, much lighter on the battery than decoding on the CPU
hwdec=auto-safe
vo=gpu-next

# Stay on the last frame instead of closing, like a GUI player
keep-open=yes
