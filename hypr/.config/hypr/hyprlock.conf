# macOS 26 style: sharp wallpaper, date over a large bold clock, name and pill password field at the bottom
# shortcuts to clear password buffer: ESC, Ctrl+U, Ctrl+Backspace

$font = Inter
# Inter Display: optical cut for large sizes, like SF Pro Display
$display = Inter Display

general {
    hide_cursor = false
}

animations {
    enabled = true
    bezier = linear, 1, 1, 0, 0
    animation = fadeIn, 1, 3, linear
    animation = fadeOut, 1, 3, linear
    animation = inputFieldDots, 1, 2, linear
}

background {
    monitor =
    path = ~/.local/share/wallpaper/current
    blur_passes = 0
}

# DATE
label {
    monitor =
    text = cmd[update:60000] date +"%A, %-d %B"
    color = rgba(255, 255, 255, 0.9)
    font_size = 26
    font_family = $display SemiBold
    shadow_passes = 1
    shadow_size = 6

    position = 0, -80
    halign = center
    valign = top
}

# TIME: no AM/PM, like macOS; date runs once a second only while locked
label {
    monitor =
    text = cmd[update:1000] date +"%-I:%M"
    color = rgba(255, 255, 255, 0.9)
    font_size = 140
    font_family = $display Bold
    shadow_passes = 1
    shadow_size = 9

    position = 0, -118
    halign = center
    valign = top
}

# NAME
label {
    monitor =
    text = $DESC
    color = rgba(255, 255, 255, 0.95)
    font_size = 17
    font_family = $font SemiBold
    shadow_passes = 1
    shadow_size = 5

    position = 0, 122
    halign = center
    valign = bottom
}

# BATTERY, top right like the macOS menu bar; read once a minute
label {
    monitor =
    text = cmd[update:60000] echo "$(cat /sys/class/power_supply/BAT*/capacity | head -1)%"
    color = rgba(255, 255, 255, 0.9)
    font_size = 16
    font_family = $font SemiBold

    position = -20, -12
    halign = right
    valign = top
}

# HINT under the field
label {
    monitor =
    text = Enter Password
    color = rgba(255, 255, 255, 0.75)
    font_size = 13
    font_family = $font

    position = 0, 34
    halign = center
    valign = bottom
}

# PASSWORD: translucent pill
input-field {
    monitor =
    size = 250, 38
    outline_thickness = 0
    rounding = -1
    inner_color = rgba(255, 255, 255, 0.2)
    outer_color = rgba(0, 0, 0, 0)
    check_color = rgba(255, 255, 255, 0.3)
    fail_color = rgba(255, 90, 90, 0.35)

    font_color = rgb(255, 255, 255)
    font_family = $font
    placeholder_text =
    fail_text = <span foreground="##ffffffcc">Incorrect Password</span>
    fade_on_empty = false
    dots_size = 0.25
    dots_spacing = 0.35
    dots_center = true

    position = 0, 70
    halign = center
    valign = bottom
}
