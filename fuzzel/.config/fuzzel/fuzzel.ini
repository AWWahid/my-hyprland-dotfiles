[main]
font=Inter:size=11:fontfeatures=ss03:fontfeatures=tnum,Material Symbols Filled:size=11
# size by scale factor like every other app, not by the panel's physical DPI
dpi-aware=no
terminal=kitty
# Spotlight-like, estimated macOS metrics (pt) x 1.12: ~640 wide (about 125 mm), upper third of the screen,
# 28 rows, 16 side padding, 26 radius
anchor=top
y-margin=240
width=76
lines=8
line-height=31
horizontal-pad=18
vertical-pad=13
inner-pad=9
image-size-ratio=1
include=~/.config/fuzzel/colors.ini

[border]
radius=29
selection-radius=9
