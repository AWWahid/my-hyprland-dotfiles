# Battery-first power management. Overrides /usr/share/tlp/defaults.conf; TLP reads
# /etc/tlp.d/*.conf in order, so this file only lists what differs from the defaults.
#
# Install: see CLAUDE.md. Do not install power-profiles-daemon, tuned or auto-cpufreq
# alongside this - all three fight TLP over the same kernel tunables.

# Every setting below gives AC and BAT the same value, so the machine behaves
# identically plugged in or not - charging is faster when the system draws less, since
# more of the adapter's budget is left for the battery. Done by pairing the values
# rather than by locking the profile with TLP_DEFAULT_MODE/TLP_PERSISTENT_DEFAULT,
# which upstream deprecated in favour of TLP_AUTO_SWITCH/TLP_PROFILE_DEFAULT; pairing
# works the same on every TLP version and needs no deprecated keys.

# This CPU (i5-1235U) runs intel_pstate in active mode with HWP, so the governor is
# only a hint and EPP is the real lever. balance_power rather than power: with turbo
# off below, the expensive high-voltage states are gone anyway, and power makes the
# ramp sluggish on the short bursts this laptop actually does (loading a page).
CPU_ENERGY_PERF_POLICY_ON_AC=balance_power
CPU_ENERGY_PERF_POLICY_ON_BAT=balance_power

# Turbo off pins the ceiling to base clock (1.3 GHz on the P-cores, down from 4.4).
# Race-to-idle would argue against this - a slower CPU keeps the 2-4 W panel lit for
# longer - but screen time here is fixed by the timetable rather than by when tasks
# finish, so display energy is a constant and only CPU energy varies. Dropping 4.4 to
# 1.3 GHz cuts power ~6x (it scales with voltage squared) while stretching work ~3x.
# Change it from the waybar battery icon when something sustained needs the speed.
CPU_BOOST_ON_AC=0
CPU_BOOST_ON_BAT=0
CPU_HWP_DYN_BOOST_ON_AC=0
CPU_HWP_DYN_BOOST_ON_BAT=0

# Idle power: where a laptop that mostly sits there actually spends its battery.
# This is TLP's own default for battery and it carries a driver denylist (xhci_hcd and
# the GPU drivers) for the devices known to misbehave when suspended.
RUNTIME_PM_ON_AC=auto
RUNTIME_PM_ON_BAT=auto

# The Bluetooth mouse: without this, autosuspending the bluetooth controller is a
# documented cause of stuttering and dropped connections. TLP excludes audio and input
# devices by default but not bluetooth, so it has to be asked for.
USB_EXCLUDE_BTUSB=1

SOUND_POWER_SAVE_ON_AC=1
SOUND_POWER_SAVE_ON_BAT=1
NMI_WATCHDOG=0

# PCIE_ASPM is deliberately left at TLP's default (`default`, i.e. whatever the kernel
# and firmware negotiated). powersupersave unlocks the L1.2 link states and saves only
# about 100 mW, against documented failures on some hardware: D3cold->D0 transitions
# breaking, deep CPU C-states becoming unreachable until reboot, and freezes. Bad trade
# for ~1% of this machine's draw. Worth revisiting only with measurements in hand.

# Wi-Fi power save OFF, overriding TLP's default of on for battery. This laptop's
# RTL8822CE is the one piece of hardware here with a bad reputation: rtw88's power save
# is a documented cause of dropped connections and latency spikes on 8822CE/8821CE, and
# HP laptops with this chip family are specifically reported to hard-lock when the
# adapter enters power save. A couple of hundred milliwatts is not worth a freeze, and
# losing the network mid-session is the one failure that is hard to recover from here.
# The chip's other power problem (rtw88 disabling PCIe ASPM for Realtek by default) is
# written up in docs/wifi-rtw88-aspm.md and likewise not applied.
WIFI_PWR_ON_AC=off
WIFI_PWR_ON_BAT=off

# Deliberately unset:
#   PLATFORM_PROFILE_*  - this HP exposes no /sys/firmware/acpi/platform_profile
#   DISK_APS_LEVEL, DISK_SPINDOWN_TIMEOUT, SATA_LINKPWR_* - NVMe only, no SATA link
#   START_CHARGE_THRESH_BAT0 - no charge control in sysfs on this machine
#   CPU_MAX_PERF_ON_* - a percentage of a range that turbo already caps at base;
#                       stacking it would push below base clock
