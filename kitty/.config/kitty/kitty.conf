include colors.conf

# Interactive shell only; bash stays the login shell
shell fish

font_family GeistMono Nerd Font Mono
font_size 14.5
window_padding_width 6
# Only the background is translucent (Hyprland blurs behind it); text stays solid
background_opacity 0.85
# Solid cursor: blinking wakes the iGPU twice a second to repaint it
cursor_blink_interval 0
# Line cursor in programs that don't pick their own shape, same as at the shell prompt
cursor_shape beam

# Nerd Font owns the private-use glyphs (yazi icons), not Material Symbols
symbol_map U+E000-U+F8FF,U+F0000-U+FFFFD Symbols Nerd Font Mono

# Ctrl+click opens links, also inside programs that take the mouse (plain click at the prompt still works)
mouse_map ctrl+left release grabbed,ungrabbed mouse_handle_click link
mouse_map ctrl+left press grabbed,ungrabbed discard_event

# Linux-convention scrollback keys (Ctrl+Shift defaults stay). Programs on the alternate
# screen (Claude Code, Codex, less) get the key instead, so they can bind it themselves
map shift+up        scroll_line_up smooth
map shift+down      scroll_line_down smooth
map shift+page_up   scroll_page_up
map shift+page_down scroll_page_down
