# Finder-style icons: one glyph per kind of file, colored like the file name ([filetype] in theme.toml).
# Generated from a kind -> extensions table; replaces yazi's per-language logos. Appended to theme.toml
# by hypr/.config/hypr/scripts/theme-toggle.sh.
[icon]
# Quick Access names carry their own glyph (Home, pinned, frequent, drive, Trash)
# (a folder only matches a glob ending in /; the second line covers a shortcut whose target is gone)
globs = [ { url = "**/yazi/quick-access/*/", text = "" }, { url = "**/yazi/quick-access/*", text = "" } ]
